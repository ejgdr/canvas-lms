---
discussion_thread_summarizer:
  state: allowed
  root_opt_in: true
  applies_to: Course
  display_name: Discussion Thread Summarizer
  description: >-
    Summarize discussion threads using AI, surfacing main themes,
    dominant viewpoints, and open questions. Disabled by default;
    account admins must enable before courses can opt in.
  environments:
    development:
      state: allowed_on
    ci:
      state: allowed_on

discussion_thread_summarizer_with_cedar:
  state: hidden
  applies_to: RootAccount
  shadow: true
  display_name: Discussion Thread Summarizer with Cedar
  description: >-
    Routes Discussion Thread Summarizer requests through Cedar
    instead of direct model calls.

discussion_thread_summarizer_scope_limited:
  state: hidden
  applies_to: RootAccount
  display_name: Discussion Thread Summarizer – Scope-Limited Mode
  description: >-
    When enabled for a root account, discussion thread summaries include
    only instructor posts and the requesting viewer's own posts.
    Addresses privacy concerns for institutional adoption (FR-5).
